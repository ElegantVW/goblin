[package]
name = "goblin"
version = "0.1.0"
edition = "2021"
description = "Goblin — mail client. Owns its accounts. No aerc."
license = "MIT"
publish = false

[[bin]]
name = "goblin"
path = "src/main.rs"

[features]
default = []
keyring = ["dep:keyring"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "linux-native", "sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
mail-parser = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hostname = "0.4"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
